[workspace]
resolver = "3"
members = ["crates/sdm-core", "crates/sdm-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/10s3r2604/supodownloadmanager"
homepage = "https://github.com/10s3r2604/supodownloadmanager"
authors = ["Supo Download Manager contributors"]

[workspace.dependencies]
sdm-core = { path = "crates/sdm-core", version = "0.1.0" }
anyhow = "1"
futures-util = "0.3"
percent-encoding = "2"
reqwest = { version = "0.13", features = ["stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
