name: Windows smoke test

# Installs a released Windows installer on a clean machine, starts SDM,
# downloads a file through it and takes screenshots, to catch problems that
# only show on Windows. Run it by hand (Actions → Windows smoke test).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release to test, e.g. v0.4.0
        required: true
      video:
        description: A video page for the yt-dlp timing job
        default: https://www.youtube.com/watch?v=aqz-KE-bpKQ
      bundled_video:
        description: A non-YouTube video page for the installed bundled tools
        default: https://www.w3schools.com/html/html5_video.asp

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - name: Download the installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ inputs.version }}" -R "${{ github.repository }}" -p "*x64-setup.exe" -D installer

      - name: Install, start and download a file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force shots | Out-Null
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @"
          using System; using System.Text; using System.Runtime.InteropServices;
          public static class Win {
            public delegate bool EnumProc(IntPtr h, IntPtr p);
            [DllImport("user32.dll")] public static extern bool EnumWindows(EnumProc f, IntPtr p);
            [DllImport("user32.dll")] public static extern bool IsWindowVisible(IntPtr h);
            [DllImport("user32.dll")] public static extern uint GetWindowThreadProcessId(IntPtr h, out uint pid);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetWindowText(IntPtr h, StringBuilder s, int n);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern uint GetDpiForWindow(IntPtr h);
            public struct RECT { public int Left, Top, Right, Bottom; }
          }
          "@
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png")
          }
          function Windows($label) {
            $ids = @(Get-Process | Where-Object { $_.ProcessName -like "*Supo*" -or $_.ProcessName -like "sdm*" } | ForEach-Object Id)
            "== $label (processes: $ids)" | Tee-Object -Append shots/windows.txt
            [Win]::EnumWindows({ param($h, $p)
              $procId = 0; [Win]::GetWindowThreadProcessId($h, [ref]$procId) | Out-Null
              if ($ids -contains $procId -and [Win]::IsWindowVisible($h)) {
                $t = New-Object System.Text.StringBuilder 256; [Win]::GetWindowText($h, $t, 256) | Out-Null
                $r = New-Object Win+RECT; [Win]::GetWindowRect($h, [ref]$r) | Out-Null
                "{0} | {1}x{2} at {3},{4} | dpi {5}" -f $t, ($r.Right - $r.Left), ($r.Bottom - $r.Top), $r.Left, $r.Top, [Win]::GetDpiForWindow($h) | Tee-Object -Append shots/windows.txt
              }
              $true }, [IntPtr]::Zero) | Out-Null
          }

          # Downloads from the browser start without asking, in English.
          $data = Join-Path $env:APPDATA "com.supodownloadmanager.app"
          New-Item -ItemType Directory -Force $data | Out-Null
          '{"confirmBrowserDownloads": false, "language": "en", "notifications": false}' | Set-Content (Join-Path $data "settings.json")

          $setup = Get-ChildItem installer -Filter *.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          $exe = Get-ChildItem "$env:LOCALAPPDATA", "$env:ProgramFiles" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "^(sdm-desktop|Supo Download Manager)\.exe$" } | Select-Object -First 1
          "installed: $($exe.FullName)" | Tee-Object shots/windows.txt
          Start-Process $exe.FullName

          $up = $false
          for ($i = 0; $i -lt 60 -and -not $up; $i++) {
            Start-Sleep 1
            try { Invoke-RestMethod http://127.0.0.1:17360/api/ping -Headers @{ "X-SDM-Client" = "smoke" } | Out-Null; $up = $true } catch {}
          }
          "bridge up: $up" | Tee-Object -Append shots/windows.txt
          if (-not $up) { throw "SDM did not start its browser bridge" }
          Start-Sleep 5
          Shot "1-started"
          Windows "after start"

          $body = '{"url":"https://github.com/10s3r2604/supodownloadmanager/archive/refs/heads/main.zip"}'
          Invoke-RestMethod http://127.0.0.1:17360/api/download -Method Post -Body $body -ContentType "application/json" -Headers @{ "X-SDM-Client" = "smoke" }
          Start-Sleep 3
          Shot "2-downloading"
          Windows "while downloading"
          Start-Sleep 20
          Shot "3-done"
          Windows "after the download"
          Get-ChildItem "$env:USERPROFILE\Downloads" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize | Out-String | Tee-Object -Append shots/windows.txt

      - name: Time the installed bundled video tools
        shell: pwsh
        env:
          BUNDLED_VIDEO: ${{ inputs.bundled_video }}
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Get-ChildItem "$env:LOCALAPPDATA", "$env:ProgramFiles" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match "^(sdm-desktop|Supo Download Manager)\.exe$" } | Select-Object -First 1
          if (-not $exe) { throw "SDM is not installed" }
          $tools = Join-Path $exe.Directory.FullName "tools"
          $ytdlp = Join-Path $tools "yt-dlp\yt-dlp.exe"
          $deno = Join-Path $tools "deno.exe"
          $ffmpeg = Join-Path $tools "ffmpeg.exe"
          foreach ($tool in @($ytdlp, $deno, $ffmpeg)) {
            if (-not (Test-Path $tool)) { throw "Bundled tool is missing: $tool" }
            "{0}: {1:N1} MB" -f $tool, ((Get-Item $tool).Length / 1MB) | Tee-Object -Append shots/bundled-video.txt
          }
          & $ytdlp --version | Tee-Object -Append shots/bundled-video.txt
          if ($LASTEXITCODE -ne 0) { throw "Bundled yt-dlp did not start" }
          & $deno --version | Tee-Object -Append shots/bundled-video.txt
          if ($LASTEXITCODE -ne 0) { throw "Bundled Deno did not start" }
          $ffmpegVersion = & $ffmpeg -version
          if ($LASTEXITCODE -ne 0) { throw "Bundled ffmpeg did not start" }
          $ffmpegVersion | Select-Object -First 1 | Tee-Object -Append shots/bundled-video.txt

          $start = [Diagnostics.ProcessStartInfo]::new($ytdlp)
          $start.UseShellExecute = $false
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          foreach ($arg in @("-J", "--no-playlist", "--socket-timeout", "15", "--retries", "0", "--extractor-retries", "0", "--js-runtimes", "deno:$deno", "--", $env:BUNDLED_VIDEO)) {
            $start.ArgumentList.Add($arg)
          }
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $probe = [Diagnostics.Process]::Start($start)
          $stdout = $probe.StandardOutput.ReadToEndAsync()
          $stderr = $probe.StandardError.ReadToEndAsync()
          if (-not $probe.WaitForExit(60000)) {
            $probe.Kill($true)
            throw "Bundled yt-dlp took more than 60 seconds to read the page"
          }
          $sw.Stop()
          $stderr.GetAwaiter().GetResult() | Tee-Object -Append shots/bundled-video.txt
          $result = $stdout.GetAwaiter().GetResult()
          "bundled yt-dlp + deno: {0:N1} s, exit: {1}" -f $sw.Elapsed.TotalSeconds, $probe.ExitCode | Tee-Object -Append shots/bundled-video.txt
          if ($probe.ExitCode -ne 0) { throw "Bundled yt-dlp could not read the video page" }
          # A page with one plain video has no "formats" list, only its "url";
          # a page with several has "entries".
          $info = $result | ConvertFrom-Json
          $formats = ($info.formats | Measure-Object).Count + ($info.entries | Measure-Object).Count + [int][bool]$info.url
          "title: $($info.title), formats: $formats" | Tee-Object -Append shots/bundled-video.txt
          if ($formats -lt 1) { throw "Bundled yt-dlp found no video on the page" }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke
          path: shots

  # How long yt-dlp takes to read a video page, in the ways SDM can run it.
  # Informational: YouTube may ask GitHub's servers to sign in, which is
  # not something SDM can change, so this job never fails the run.
  ytdlp-timing:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - name: Time yt-dlp
        shell: pwsh
        env:
          VIDEO_PAGE: ${{ inputs.video }}
        run: |
          $ErrorActionPreference = "Continue"
          $base = "https://github.com/yt-dlp/yt-dlp/releases/latest/download"
          Invoke-WebRequest "$base/yt-dlp.exe" -OutFile yt-dlp.exe
          Invoke-WebRequest "$base/yt-dlp_win.zip" -OutFile yt-dlp_win.zip
          Expand-Archive yt-dlp_win.zip -DestinationPath onedir
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          Expand-Archive deno.zip -DestinationPath deno
          $url = $env:VIDEO_PAGE
          $onedir = Get-ChildItem onedir -Recurse -Filter yt-dlp.exe | Select-Object -First 1
          function Time($label, $exe, $extra) {
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $out = & $exe -J --no-playlist @extra -- $url 2> err.txt
            $sw.Stop()
            $formats = 0
            try { $formats = ($out | ConvertFrom-Json).formats.Count } catch {}
            "{0,-28} {1,6:N1} s  formats: {2}  exit: {3}" -f $label, $sw.Elapsed.TotalSeconds, $formats, $LASTEXITCODE
            Get-Content err.txt | Select-Object -Last 3 | ForEach-Object { "    $_" }
          }
          Time "version (single file)" ".\yt-dlp.exe" @("--version")
          $sw = [Diagnostics.Stopwatch]::StartNew(); & .\yt-dlp.exe --version; "single-file start: {0:N1} s" -f $sw.Elapsed.TotalSeconds
          $sw = [Diagnostics.Stopwatch]::StartNew(); & $onedir.FullName --version; "folder start: {0:N1} s" -f $sw.Elapsed.TotalSeconds
          Time "single file" ".\yt-dlp.exe" @()
          Time "single file + deno" ".\yt-dlp.exe" @("--js-runtimes", "deno:$PWD\deno\deno.exe")
          Time "folder" $onedir.FullName @()
          Time "folder + deno" $onedir.FullName @("--js-runtimes", "deno:$PWD\deno\deno.exe")
