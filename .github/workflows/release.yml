name: Release

# Push a tag such as `v0.2.0`, or run this workflow by hand with the version,
# to build the desktop app installers, the `sdm` command line tool and the
# browser extension, and publish them as a GitHub release (the release
# creates the tag when it does not exist yet).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, e.g. v0.4.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  VERSION: ${{ inputs.version || github.ref_name }}

jobs:
  desktop:
    name: Desktop app (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: ""
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: macOS Apple Silicon
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            args: --target x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - working-directory: apps/desktop
        run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ env.VERSION }}
          releaseName: Supo Download Manager ${{ env.VERSION }}
          releaseBody: |
            Free, open-source download manager with multi-connection downloads, a video grabber and BitTorrent (magnet links and .torrent files).

            ## Which file do I need?

            | System | File |
            | --- | --- |
            | Windows 10/11 | `Supo.Download.Manager_*_x64-setup.exe` (or the `.msi`) |
            | macOS, Apple Silicon (M1–M4) | `Supo.Download.Manager_*_aarch64.dmg` |
            | macOS, Intel | `Supo.Download.Manager_*_x64.dmg` |
            | Ubuntu, Debian, Mint | `*_amd64.deb` |
            | Fedora, openSUSE | `*.x86_64.rpm` |
            | Any Linux | `*_amd64.AppImage` |
            | Command line only | `sdm-cli-*` for your system |
            | Browser extension (manual install) | `sdm-extension-chromium-*.zip` or `sdm-extension-firefox-*.zip` |

            The installers are not code-signed yet:

            - **Windows**: if SmartScreen warns, click **More info → Run anyway**.
            - **macOS**: if macOS says the app is damaged or from an unidentified developer, run
              `xattr -dr com.apple.quarantine "/Applications/Supo Download Manager.app"` once, then open it.

            After installing, open SDM and click **Browsers** to add the browser extension.
            See the [README](https://github.com/10s3r2604/supodownloadmanager#readme) for details.
          args: ${{ matrix.args }}

  cli:
    name: CLI ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked -p sdm-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="sdm-cli-${VERSION}-${{ matrix.target }}"
          mkdir "$name"
          cp README.md LICENSE "$name"/
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp "target/${{ matrix.target }}/release/sdm.exe" "$name"/
            7z a "$name.zip" "$name"
          else
            cp "target/${{ matrix.target }}/release/sdm" "$name"/
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sdm-cli-${{ matrix.target }}
          path: |
            sdm-cli-*.zip
            sdm-cli-*.tar.gz

  publish:
    name: Publish CLI and extension
    needs: [desktop, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Package the browser extension
        run: |
          node extension/build.mjs
          (cd extension/dist/chromium && zip -r "../../../sdm-extension-chromium-${VERSION}.zip" .)
          (cd extension/dist/firefox && zip -r "../../../sdm-extension-firefox-${VERSION}.zip" .)
          (cd extension/dist/chromium-store && zip -r "../../../sdm-extension-store-chromium-${VERSION}.zip" .)
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            dist/*
            sdm-extension-*.zip
