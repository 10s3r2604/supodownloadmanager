name: Browser setup

on:
  pull_request:
    paths:
      - apps/desktop/src-tauri/src/browser_install.ps1
      - apps/desktop/src-tauri/src/browser_automation.rs
      - .github/scripts/browser-setup-windows-smoke.cjs
      - .github/workflows/browser-setup-smoke.yml

jobs:
  browsers:
    name: Load unpacked extension through normal ${{ matrix.browser }} controls
    runs-on: windows-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]
    env:
      SDM_SETUP_TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node extension/build.mjs
      - run: node .github/scripts/browser-setup-windows-smoke.cjs

