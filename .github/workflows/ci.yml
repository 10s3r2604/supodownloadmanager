name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop app system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build the web interface
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all --check
      - run: node --test extension/tests/*.test.mjs
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test engine and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  desktop:
    name: Test desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build the web interface and the extension
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: cargo test -p sdm-desktop --locked
      - name: Build the native Windows app
        if: runner.os == 'Windows'
        run: cargo build -p sdm-desktop --locked
      - name: Test native Windows progress windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testDeps = Join-Path $env:RUNNER_TEMP "sdm-progress-test"
          npm install --prefix $testDeps --no-save --package-lock=false playwright-core@1.57.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SDM_SMOKE_NODE_MODULES = Join-Path $testDeps "node_modules"
          node .github/scripts/progress-windows-smoke.cjs
      - name: Upload native Windows progress checks
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-progress-smoke
          path: progress-smoke/
          if-no-files-found: ignore
