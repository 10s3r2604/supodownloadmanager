name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  browser_setup:
    name: Test first-run browser loading (Chrome)
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      SDM_SETUP_TEST_BROWSER: chrome
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node extension/build.mjs
      - run: node .github/scripts/browser-setup-windows-smoke.cjs

  extension:
    name: Test browser download capture (Chrome)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test packaged extension downloads in Chrome
        shell: pwsh
        run: |
          node extension/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testDeps = Join-Path $env:RUNNER_TEMP "sdm-download-test"
          npm install --prefix $testDeps --no-save --package-lock=false playwright-core@1.57.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SDM_SMOKE_NODE_MODULES = Join-Path $testDeps "node_modules"
          node .github/scripts/extension-download-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Chrome download capture checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-download-smoke
          path: download-smoke/
          if-no-files-found: ignore

  extension_video:
    name: Test browser video menus (Edge)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test packaged extension video menus in Edge
        shell: pwsh
        run: |
          node extension/build.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $testDeps = Join-Path $env:RUNNER_TEMP "sdm-video-menu-test"
          npm install --prefix $testDeps --no-save --package-lock=false playwright-core@1.57.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SDM_SMOKE_NODE_MODULES = Join-Path $testDeps "node_modules"
          $env:SDM_SMOKE_OUTPUT = "edge-smoke"
          node .github/scripts/extension-menu-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload Edge video menu checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-video-menu-smoke
          path: edge-smoke/
          if-no-files-found: ignore

  lint:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install desktop app system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build the web interface
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: node .github/scripts/check-version.mjs
      - run: node --test .github/scripts/release/*.test.mjs
      - run: cargo fmt --all --check
      - run: node --test extension/tests/*.test.mjs
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Upload browser extensions for testing
        uses: actions/upload-artifact@v4
        with:
          name: sdm-browser-extensions
          path: |
            extension/dist/chromium/
            extension/dist/firefox/
          if-no-files-found: error

  test:
    name: Test engine and CLI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  desktop:
    name: Test desktop app (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Build the web interface and the extension
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build
      - run: cargo test -p sdm-desktop --locked
      - name: Build the native Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $config = Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $config.app.windows[0] | Add-Member -NotePropertyName additionalBrowserArgs -NotePropertyValue "--remote-debugging-port=9222" -Force
          $env:TAURI_CONFIG = $config | ConvertTo-Json -Depth 100 -Compress
          cargo build -p sdm-desktop --locked
      - name: Ensure WebView2 is installed for the native app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeRoots = @("${env:ProgramFiles(x86)}\Microsoft\EdgeWebView\Application", "$env:ProgramFiles\Microsoft\EdgeWebView\Application", "$env:LOCALAPPDATA\Microsoft\EdgeWebView\Application")
          $runtime = Get-ChildItem $runtimeRoots -Recurse -Filter msedgewebview2.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $runtime) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP "MicrosoftEdgeWebview2Setup.exe"
            Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile $bootstrapper
            $install = Start-Process $bootstrapper -ArgumentList "/silent /install" -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "WebView2 installer exited with $($install.ExitCode)" }
            $runtime = Get-ChildItem $runtimeRoots -Recurse -Filter msedgewebview2.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $runtime) { throw "The WebView2 runtime was not found" }
          Write-Host "WebView2: $($runtime.FullName)"
      - name: Test native Windows media and browser confirmation windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $testDeps = Join-Path $env:RUNNER_TEMP "sdm-progress-test"
          npm install --prefix $testDeps --no-save --package-lock=false playwright-core@1.57.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:SDM_SMOKE_NODE_MODULES = Join-Path $testDeps "node_modules"
          node .github/scripts/progress-windows-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native Windows progress checks
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-progress-smoke
          path: progress-smoke/
          if-no-files-found: ignore
      - name: Upload the Chromium extension for testing
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: sdm-browser-extension
          path: extension/dist/chromium/
          if-no-files-found: error
      - name: Bundle video tools for the Windows test installer
        if: runner.os == 'Windows' && success()
        shell: bash
        run: bash .github/scripts/bundle-tools.sh Windows deno-x86_64-pc-windows-msvc.zip
      - name: Build the Windows test installer
        if: runner.os == 'Windows' && success()
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $testConfig = Join-Path $env:RUNNER_TEMP "sdm-test-installer.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -Path $testConfig -Encoding utf8
          npm run tauri build -- --bundles nsis --config $testConfig
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test release Native Messaging in Chrome and Edge
        if: runner.os == 'Windows' && success()
        shell: pwsh
        run: |
          $env:SDM_SMOKE_NODE_MODULES = Join-Path (Join-Path $env:RUNNER_TEMP "sdm-progress-test") "node_modules"
          node .github/scripts/native-connection-windows-smoke.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload native browser connection checks
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-connection-smoke
          path: native-connection-smoke/
          if-no-files-found: ignore
      - name: Upload the Windows test installer
        if: runner.os == 'Windows' && success()
        uses: actions/upload-artifact@v4
        with:
          name: sdm-windows-test-installer
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
